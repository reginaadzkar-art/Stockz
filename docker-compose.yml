services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockz_app
    ports:
      - "8000:10000"
    environment:
      - APP_NAME=Stockz
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:XQ/UoV8gP8n6e3Kq6m0Q3pT9o2Z1h5x7v9l8w4c2j1k=
      - APP_URL=http://localhost:8000
      - AUTO_MIGRATE=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - PORT=10000
    volumes:
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
    restart: unless-stopped
